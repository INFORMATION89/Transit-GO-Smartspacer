# Publishes a GitHub release with the APK when a version tag (v1.0, v1.1, ...) is pushed.
# The release text comes from .github/release-notes.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "transit-go-smartspacer-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Transit GO for Smartspacer ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: transit-go-smartspacer-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
